<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Cupcakes Gourmet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; }
        header { text-align: center; color: #d63384; margin-bottom: 30px; }
        .vitrine { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .card h3 { color: #800040; margin-bottom: 5px; }
        .card p { color: #555; }
        .price { font-weight: bold; color: #d63384; font-size: 1.2em; }
        button { background-color: #d63384; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #b02a6b; }
        .container-painel { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .bloco { background: white; padding: 20px; border-radius: 10px; width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bloco input { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>🧁 Cupcakes Gourmet da Ariele</h1>
        <p>Faça o seu pedido online com entrega rápida!</p>
    </header>

    <div class="vitrine">
        <div class="card">
            <h3>Red Velvet</h3>
            <p>Massa vermelha com cream cheese.</p>
            <p class="price">R$ 12,50</p>
            <button onclick="adicionarAoCarrinho('Red Velvet', 12.50)">Adicionar</button>
        </div>
        <div class="card">
            <h3>ChocoNinho</h3>
            <p>Chocolate com recheio de Ninho.</p>
            <p class="price">R$ 14,00</p>
            <button onclick="adicionarAoCarrinho('ChocoNinho', 14.00)">Adicionar</button>
        </div>
        <div class="card">
            <h3>Sensação</h3>
            <p>Chocolate com pedaços de morango.</p>
            <p class="price">R$ 11,00</p>
            <button onclick="adicionarAoCarrinho('Sensação', 11.00)">Adicionar</button>
        </div>
    </div>

    <div class="container-painel">
        <!-- Dados de Entrega do Cliente -->
        <div class="bloco">
            <h2>Dados de Entrega</h2>
            <label>Nome Completo:</label>
            <input type="text" id="nomeCliente" placeholder="Ex: Maria Silva">
            
            <label>Telefone / WhatsApp:</label>
            <input type="text" id="telCliente" placeholder="(14) 99999-9999">
            
            <label>Endereço de Entrega:</label>
            <input type="text" id="endCliente" placeholder="Rua, Número, Bairro">
        </div>

        <!-- Carrinho de Compras -->
        <div class="bloco">
            <h2>Seu Carrinho</h2>
            <ul id="itens-carrinho"></ul>
            <p><strong>Total: R$ <span id="valor-total">0.00</span></strong></p>
            <button onclick="finalizarPedido()" style="width: 100%;">Finalizar Pedido Online</button>
        </div>
    </div>

    <script>
        let total = 0;
        let itens = [];

        function adicionarAoCarrinho(nome, preco) {
            itens.push({ nome, preco });
            total += preco;
            atualizarTela();
        }

        function atualizarTela() {
            const lista = document.getElementById('itens-carrinho');
            lista.innerHTML = '';
            itens.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.nome} - R$ ${item.preco.toFixed(2)}`;
                lista.appendChild(li);
            });
            document.getElementById('valor-total').textContent = total.toFixed(2);
        }

        function finalizarPedido() {
            const nome = document.getElementById('nomeCliente').value;
            const endereco = document.getElementById('endCliente').value;

            if (itens.length === 0) {
                alert('Seu carrinho está vazio! Adicione pelo menos um cupcake.');
                return;
            }
            if (!nome || !endereco) {
                alert('Por favor, preencha o seu Nome e o Endereço de entrega!');
                return;
            }

            alert(`Obrigado pelo pedido, ${nome}!\n\nSeus cupcakes serão entregues em:\n${endereco}\n\nPedido realizado com sucesso!`);
            
            // Limpa tudo após o pedido
            itens = [];
            total = 0;
            atualizarTela();
            document.getElementById('nomeCliente').value = '';
            document.getElementById('telCliente').value = '';
            document.getElementById('endCliente').value = '';
        }
    </script>
</body>
</html>
